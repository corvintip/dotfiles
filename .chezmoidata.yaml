packages:
  git:
    darwin:
      via: brew 
      pkgName: git # can be used to overwrite the default pkg name used when installing via pkg managers
    linux_debian:
      via: apt
      pkgName: git
    groups: [ "base", "node_development" ]
  neovim:
    darwin:
      via: brew
    linux_debian:
      via: apt
    groups: [ "base", "node_development" ]
  fzf:
    darwin:
      via: brew
    groups: [ "base", "node_development" ]
  jq:
    darwin:
      via: brew
    linux_debian:
      via: apt
    groups: [ "base", "node_development" ]
  zsh:
    darwin:
      via: brew
    linux_debian:
      via: apt
    groups: [ "base", "node_development" ]
  starship:
    darwin:
      via: brew
    linux_debian:
      via: script # an external "run_onchange" script handles this installation
    groups: [ "base", "node_development" ]
  mise:
    darwin:
      via: script
    linux_debian:
      via: script
    groups: [ "node_development" ]
